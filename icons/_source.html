<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>icon source</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(circle at 50% 26%, #FFFDF3 0%, #FDF3D6 52%, #FBEBC4 100%);
    display: grid;
    place-items: center;
  }
  .art { width: var(--art, 72%); height: var(--art, 72%); }
  .art svg { display: block; width: 100%; height: 100%; filter: drop-shadow(0 10px 18px rgba(190, 155, 105, .22)); }
</style>
</head>
<body>
  <div class="art" id="art"></div>
  <script src="../js/characters.js"></script>
  <script>
    var params = new URLSearchParams(location.search);
    document.documentElement.style.setProperty('--art', (params.get('art') || '72') + '%');
    document.getElementById('art').innerHTML = window.FamilyChars.svg(params.get('char') || 'hamster');
  </script>
</body>
</html>
